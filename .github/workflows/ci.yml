# Every job calls make targets, so CI runs exactly what agents and people run locally.
# Require only "ci-summary" in the ruleset (.github/rulesets/main.json): it runs even when
# other jobs fail or are skipped, and passes only when each of them passed.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  make:
    # Skipped only in the template repo itself (repository variable TEMPLATE_SELF=true), whose
    # targets are unfilled on purpose; template-self-test.yml checks it instead.
    if: vars.TEMPLATE_SELF != 'true'
    name: make ${{ matrix.targets }}
    strategy:
      fail-fast: false
      matrix:
        targets: ["lint typecheck guards generate-check", test, test-db, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: make $TARGETS
        env:
          TARGETS: ${{ matrix.targets }}

  workflow-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          inputs: .github/workflows .github/actions
          version: 1.30.1
          min-severity: high
          advanced-security: false

  ci-summary:
    name: ci-summary
    if: always()
    needs: [make, workflow-lint]
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed
        env:
          MAKE: ${{ needs.make.result }}
          WORKFLOW_LINT: ${{ needs.workflow-lint.result }}
          TEMPLATE_SELF: ${{ vars.TEMPLATE_SELF }}
        run: |
          echo "make: $MAKE, workflow-lint: $WORKFLOW_LINT"
          [ "$WORKFLOW_LINT" = success ] || exit 1
          [ "$MAKE" = success ] || { [ "$TEMPLATE_SELF" = true ] && [ "$MAKE" = skipped ]; }
