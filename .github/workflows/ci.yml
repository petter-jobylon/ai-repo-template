# Every job calls a make target, so CI runs exactly what agents and people run locally.
# Require only "ci-summary" in the ruleset (.github/rulesets/main.json): it runs even when
# other jobs are skipped, and fails unless each of them did what it should.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    if: vars.TEMPLATE_SELF != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # guards that compare with the base branch need its history
      - uses: ./.github/actions/setup
      - run: make lint
      - run: make typecheck
      - run: make guards
        env:
          GUARD_BASE: ${{ github.base_ref && format('origin/{0}', github.base_ref) || '' }}
      - run: make generate-check

  test:
    if: vars.TEMPLATE_SELF != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: make test

  test-db:
    if: vars.TEMPLATE_SELF != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: make test-db

  build:
    if: vars.TEMPLATE_SELF != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: make build

  workflow-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          inputs: .github/workflows .github/actions
          version: 1.30.1
          min-severity: high
          advanced-security: false

  # Runs only in the template repo itself (repository variable TEMPLATE_SELF=true), where the
  # make targets are deliberately unfilled. Adopting repos skip it and run the jobs above.
  template-self-test:
    if: vars.TEMPLATE_SELF == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: make guards
        env:
          TEMPLATE_SELF: ${{ vars.TEMPLATE_SELF }}
      - name: Unfilled targets fail loudly
        run: |
          if make lint 2>err.txt; then echo "make lint passed while unfilled"; exit 1; fi
          grep -q "not configured yet" err.txt

  ci-summary:
    name: ci-summary
    if: always()
    needs: [checks, test, test-db, build, workflow-lint, template-self-test]
    runs-on: ubuntu-latest
    steps:
      - name: Every job did what it should
        env:
          TEMPLATE_SELF: ${{ vars.TEMPLATE_SELF }}
          CHECKS: ${{ needs.checks.result }}
          TEST: ${{ needs.test.result }}
          TEST_DB: ${{ needs.test-db.result }}
          BUILD: ${{ needs.build.result }}
          WORKFLOW_LINT: ${{ needs.workflow-lint.result }}
          SELF_TEST: ${{ needs.template-self-test.result }}
        run: |
          if [ "$TEMPLATE_SELF" = "true" ]; then main=skipped; self=success; else main=success; self=skipped; fi
          fail=0
          for pair in "checks:$CHECKS" "test:$TEST" "test-db:$TEST_DB" "build:$BUILD"; do
            [ "${pair#*:}" = "$main" ] || { echo "${pair%%:*} is ${pair#*:}, expected $main"; fail=1; }
          done
          [ "$WORKFLOW_LINT" = "success" ] || { echo "workflow-lint is $WORKFLOW_LINT"; fail=1; }
          [ "$SELF_TEST" = "$self" ] || { echo "template-self-test is $SELF_TEST, expected $self"; fail=1; }
          exit $fail
